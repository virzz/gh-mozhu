name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --check

      - name: Run tests
        run: cargo test --locked --all-targets

  release:
    name: Release ${{ matrix.asset_suffix }}
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            asset_suffix: linux-amd64
            binary: gh-mozhu
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            asset_suffix: linux-arm64
            binary: gh-mozhu
          - os: macos-14
            target: aarch64-apple-darwin
            asset_suffix: darwin-arm64
            binary: gh-mozhu
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            asset_suffix: windows-amd64.exe
            binary: gh-mozhu.exe
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Build release binary
        run: cargo build --locked --release --target "${{ matrix.target }}"

      - name: Stage asset
        shell: bash
        run: |
          mkdir -p dist
          cp "target/${{ matrix.target }}/release/${{ matrix.binary }}" "dist/gh-mozhu-${{ matrix.asset_suffix }}"

      - name: Upload release asset
        uses: softprops/action-gh-release@v3
        with:
          files: dist/gh-mozhu-${{ matrix.asset_suffix }}
          generate_release_notes: true
